<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#557a7a">
<title>birthday.exe</title>
<style>
:root{--pink:#ed5da4;--pale:#ffb3d2;--blue:#1717ed;--ink:#101018;--teal:#557a7a;--paper:#fff4f8;--line:#171717;--shadow:5px 5px 0 var(--ink)}
*{box-sizing:border-box}body{margin:0;background:var(--teal);color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;padding:24px;min-height:100vh}
button,input{font:inherit}button{cursor:pointer;color:var(--ink)}.shell{max-width:1050px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;color:var(--paper);font-size:.8rem;margin:0 0 20px}.lights{display:flex;gap:7px}.lights i{width:11px;height:11px;border:2px solid var(--ink);background:var(--pink);display:block}.lights i:nth-child(2){background:#ffdb4d}.lights i:nth-child(3){background:#51d986}
header h1{font-size:clamp(2.4rem,8vw,5.2rem);line-height:.9;letter-spacing:-.08em;margin:0;color:var(--pink);text-shadow:4px 4px var(--ink)}header p{color:var(--paper);margin:20px 0 28px;font-size:.92rem}
.window{background:var(--paper);border:4px solid var(--ink);box-shadow:var(--shadow);margin-bottom:22px}.bar{background:var(--blue);color:white;padding:10px 14px;border-bottom:4px solid var(--ink);display:flex;justify-content:space-between;align-items:center;font-weight:800}.bar .x{color:var(--ink);background:var(--pale);border:2px solid var(--ink);padding:1px 7px}.inside{padding:20px}
.intro{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}.today{font-size:.8rem;line-height:1.7}.today strong{font-size:1.15rem}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:3px solid var(--ink);background:var(--pink);padding:10px 14px;box-shadow:3px 3px 0 var(--ink);font-weight:800}.btn:active{box-shadow:none;transform:translate(3px,3px)}.btn.secondary{background:#fff}.btn.blue{background:#a7a7ff}
.people{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{border:3px solid var(--ink);background:white;box-shadow:4px 4px 0 var(--ink);min-width:0}.cardhead{padding:12px 14px;background:var(--pale);border-bottom:3px solid var(--ink);display:flex;justify-content:space-between;gap:8px;align-items:center}.name{font-size:1.1rem;font-weight:900;overflow-wrap:anywhere}.remove{border:2px solid var(--ink);background:white;font-size:.75rem;padding:4px 7px}.cardbody{padding:14px}.age{font-size:clamp(1.25rem,4vw,1.8rem);font-weight:900;margin-bottom:8px}.sub{font-size:.78rem;line-height:1.5;color:#34343a}.track{height:24px;border:3px solid var(--ink);margin:14px 0 7px;background:repeating-linear-gradient(90deg,#fff 0 12px,#ddd 12px 15px);padding:2px}.fill{height:100%;width:0;background:repeating-linear-gradient(90deg,var(--blue) 0 12px,#5555ff 12px 15px);transition:width .4s}.trackrow{display:flex;justify-content:space-between;font-size:.7rem;font-weight:700}.birthday{margin-top:12px;padding-top:10px;border-top:2px dashed #aaa;font-size:.78rem;line-height:1.5}.empty{text-align:center;padding:38px 12px;color:#555;font-size:.9rem;line-height:1.7}.form{display:none;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end}.form.show{display:grid}.field label{font-size:.7rem;font-weight:800;display:block;margin-bottom:5px}.field input{width:100%;border:2px solid var(--ink);padding:10px;background:white}.footer{color:var(--paper);font-size:.7rem;line-height:1.6;text-align:center;margin:18px auto}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:11px 16px;display:none;max-width:90vw;font-size:.8rem}
@media(max-width:680px){body{padding:15px}.people{grid-template-columns:1fr}.intro{grid-template-columns:1fr}.form.show{grid-template-columns:1fr 1fr}.form .btn{grid-column:1/-1}.inside{padding:15px}.top{margin-bottom:15px}}
</style>
</head>
<body>
<main class="shell">
  <div class="top"><span>family records / v1.0</span><span class="lights" aria-hidden="true"><i></i><i></i><i></i></span></div>
  <header><h1>birthday.exe</h1><p>a little birthday and age tracker for the people we love.</p></header>
  <section class="window" aria-label="birthday dashboard">
    <div class="bar"><span>WHO'S GETTING OLDER?</span><span class="x" aria-hidden="true">×</span></div>
    <div class="inside intro"><div class="today" id="today"></div><div class="actions"><button class="btn" id="addToggle">+ add a person</button><button class="btn secondary" id="exportBtn">save/share data</button><button class="btn blue" id="importBtn">load data</button><input id="importFile" type="file" accept="application/json,.json" hidden></div></div>
    <div class="inside form" id="form">
      <div class="field"><label for="personName">NAME</label><input id="personName" maxlength="50" placeholder="their name" required></div>
      <div class="field"><label for="birthday">BIRTHDAY</label><input id="birthday" type="date" required></div>
      <button class="btn" id="savePerson">save person</button>
    </div>
  </section>
  <section class="people" id="people" aria-live="polite"></section>
  <p class="footer">your list stays in this browser. use “save/share data” to download a backup you can move to another device.<br>no data is sent anywhere.</p>
</main>
<div class="toast" id="toast" role="status"></div>
<script>
(()=>{
const KEY='birthday-exe-people-v1';let people=[];
const $=id=>document.getElementById(id);
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function localDate(y,m,d){return new Date(y,m,d,12)}
function dateFromInput(s){const [y,m,d]=s.split('-').map(Number);return localDate(y,m-1,d)}
function nextBirthday(date,now){let b=localDate(now.getFullYear(),date.getMonth(),date.getDate());if(b<localDate(now.getFullYear(),now.getMonth(),now.getDate()))b=localDate(now.getFullYear()+1,date.getMonth(),date.getDate());return b}
function ageAt(date,now){let age=now.getFullYear()-date.getFullYear();const b=localDate(now.getFullYear(),date.getMonth(),date.getDate());if(localDate(now.getFullYear(),now.getMonth(),now.getDate())<b)age--;return age}
function dayDiff(a,b){return Math.round((localDate(b.getFullYear(),b.getMonth(),b.getDate())-localDate(a.getFullYear(),a.getMonth(),a.getDate()))/86400000)}
function fullDate(d){return new Intl.DateTimeFormat(undefined,{month:'long',day:'numeric'}).format(d)}
function save(){localStorage.setItem(KEY,JSON.stringify(people))}
function render(){const now=new Date();$('today').innerHTML=`<strong>${new Intl.DateTimeFormat(undefined,{weekday:'long',month:'long',day:'numeric'}).format(now)}</strong><br>the calendar keeps turning. here’s where everyone is in their year.`;
  const root=$('people');if(!people.length){root.innerHTML='<div class="window empty" style="grid-column:1/-1">no birthdays in the system yet.<br>add someone to get started.</div>';return}
  root.innerHTML=people.map(p=>{const bd=dateFromInput(p.date),age=ageAt(bd,now),next=nextBirthday(bd,now),days=dayDiff(now,next);const last=localDate(next.getFullYear()-1,bd.getMonth(),bd.getDate());const span=Math.max(1,dayDiff(last,next));const elapsed=Math.max(0,dayDiff(last,localDate(now.getFullYear(),now.getMonth(),now.getDate())));const pct=Math.min(100,Math.max(0,elapsed/span*100));const birthdayToday=days===0;return `<article class="card"><div class="cardhead"><span class="name">${escapeHtml(p.name)}</span><button class="remove" data-remove="${p.id}" aria-label="remove ${escapeHtml(p.name)}">remove</button></div><div class="cardbody"><div class="age">${age<0?'not born yet':`${age} ${age===1?'year':'years'} old`}</div><div class="sub">birthday: ${fullDate(bd)}</div><div class="track" role="progressbar" aria-label="${escapeHtml(p.name)} progress through this year of life" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(pct)}"><div class="fill" style="width:${pct}%"></div></div><div class="trackrow"><span>${Math.floor(pct)}% through this year</span><span>${days===0?'birthday today!':`${days} days to go`}</span></div><div class="birthday">${birthdayToday?'🎉 today is the day!':`next birthday: ${fullDate(next)}${days===1?' · tomorrow':''}`}</div></div></article>`}).join('');
}
function toast(msg){const t=$('toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',2600)}
try{people=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(people))people=[]}catch{people=[]}
$('addToggle').onclick=()=>{$('form').classList.toggle('show');if($('form').classList.contains('show'))$('personName').focus()};
$('savePerson').onclick=()=>{const name=$('personName').value.trim(),date=$('birthday').value;if(!name||!date){toast('add a name and birthday first.');return}people.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),name,date});people.sort((a,b)=>a.date.slice(5).localeCompare(b.date.slice(5)));save();$('personName').value='';$('birthday').value='';$('form').classList.remove('show');render()};
$('people').onclick=e=>{const b=e.target.closest('[data-remove]');if(!b)return;people=people.filter(p=>p.id!==b.dataset.remove);save();render()};
$('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(people,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='birthday-board-data.json';a.click();URL.revokeObjectURL(a.href);toast('data file downloaded. move it with the page to share your list.')};
$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!Array.isArray(data)||data.some(p=>!p.name||!/^\d{4}-\d{2}-\d{2}$/.test(p.date)))throw Error();people=data.map(p=>({id:String(p.id||Date.now()+Math.random()),name:String(p.name).slice(0,50),date:p.date}));save();render();toast('birthday data loaded.')}catch{toast('could not read that birthday data file.')}e.target.value=''};
render();setInterval(render,60000);
})();
</script>
</body>
</html>
